<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta tu Progreso</title>
<style>
:root { --sena:#39A900; --header:#1B4332; --bg:#F5F5F0; --card:#fff; --text:#1a1a1a; --muted:#666; --border:#ddd;
  --pass-bg:#E8F5E9; --pass:#2E7D32; --low-bg:#FFF3E0; --low:#F57C00; --miss-bg:#FFEBEE; --miss:#C62828; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161916; --card:#1e211e; --text:#e4e4e0; --muted:#9a9a95; --border:#333;
    --pass-bg:#1b2e1b; --low-bg:#2a1f0f; --miss-bg:#2a1010; } }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.head { background:var(--header); color:#fff; text-align:center; padding:18px 16px; }
.head h1 { font-size:1.3rem; } .head p { font-size:.8rem; opacity:.8; }
.wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
.card { background:var(--card); border-radius:12px; padding:28px; box-shadow:0 2px 8px rgba(0,0,0,.1); text-align:center; }
input { width:100%; padding:12px; font-size:1rem; border:2px solid var(--border); border-radius:8px; text-align:center; letter-spacing:1px; background:var(--card); color:var(--text); margin-top:14px; }
input:focus { outline:none; border-color:var(--sena); }
button { width:100%; margin-top:12px; padding:12px; background:var(--sena); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; }
.err { color:var(--miss); font-size:.85rem; margin-top:10px; display:none; }
#result { display:none; }
.greet { font-size:1.25rem; font-weight:700; margin-bottom:4px; }
.ficha { font-size:.85rem; color:var(--muted); margin-bottom:14px; }
.banner { padding:12px 16px; border-radius:8px; font-size:.9rem; margin-bottom:14px; text-align:left; }
.banner.ok { background:var(--pass-bg); color:var(--pass); }
.banner.mid { background:var(--low-bg); color:var(--low); }
.banner.bad { background:var(--miss-bg); color:var(--miss); }
.bar { height:14px; background:var(--border); border-radius:7px; overflow:hidden; margin:6px 0 18px; }
.fill { height:100%; background:var(--sena); }
.ev { display:flex; gap:10px; align-items:flex-start; text-align:left; padding:10px 0; border-bottom:1px solid var(--border); font-size:.85rem; }
.ev:last-child { border:none; }
.ev .ic { font-size:1.1rem; }
.ev .nm { font-weight:600; }
.ev .st { font-size:.78rem; }
.st.ok { color:var(--pass); } .st.low { color:var(--low); } .st.miss { color:var(--miss); }
.st.pend { color:var(--low); } .st.retry { color:#1565C0; }
.back { margin-top:18px; background:transparent; color:var(--sena); border:2px solid var(--sena); }
.foot { text-align:center; font-size:.72rem; color:var(--muted); padding:20px; }
</style>
</head>
<body>
<div class="head"><h1>Consulta tu Progreso</h1><p>Ingresa tu n&uacute;mero de documento</p></div>
<div class="wrap">
  <div class="card" id="login">
    <div style="font-size:2rem">&#128274;</div>
    <p style="font-size:.85rem;color:var(--muted);margin-top:8px">Solo t&uacute; puedes ver tus calificaciones.</p>
    <input id="ced" placeholder="N&uacute;mero de documento" inputmode="numeric">
    <button id="btn">Consultar</button>
    <p class="err" id="err">Documento no encontrado. Verifica el n&uacute;mero.</p>
  </div>
  <div class="card" id="result"></div>
</div>
<div class="foot">Si tienes dudas, contacta a tu instructor.</div>

function title(s){return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}
function lookup(){
  var v=document.getElementById('ced').value.trim().replace(/\D/g,'');
  var recs=DB.filter(function(r){return r.c===v});
  if(!recs.length){document.getElementById('err').style.display='block';return}
  document.getElementById('err').style.display='none';
  var html='';
  recs.forEach(function(s){
    var total=s.items.length||s.g.length, fail=s.g.filter(function(g){return g==='D'||g==='d'}).length;
    var done=s.g.filter(function(g){return g!=='-'&&g!=='D'&&g!=='d'}).length;
    var pending=total-done-fail;
    var pct=total?Math.round(done/total*100):0;
    var need=pending+fail;
    var cls=need===0?'ok':(done===0?'bad':'mid');
    var msg=need===0?'&#127881; ¡Felicitaciones! Has aprobado todas las evidencias.':
      done===0?'&#9888;&#65039; No has entregado ninguna evidencia. Ingresa a Zajuna y ponte al día cuanto antes.':
      'Vas avanzando: llevas '+done+' de '+total+' aprobadas.'+(fail?' &#9888;&#65039; '+fail+(fail===1?' evidencia reprobada':' evidencias reprobadas')+' que debes reenviar.':'')+(pending?' Te faltan '+pending+' por enviar.':'');
    html+='<div class="greet">Hola, '+title(s.n)+'</div><div class="ficha">'+s.f+' &middot; Documento: '+s.c+'</div>'+
      '<div class="banner '+cls+'">'+msg+'</div>'+
      '<div style="font-size:.8rem;color:var(--muted);text-align:left">Progreso: '+done+'/'+total+' ('+pct+'%)</div>'+
      '<div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>';
    s.items.forEach(function(it,i){
      var g=s.g[i];
      if(g==='-') html+='<div class="ev"><span class="ic">&#9203;</span><div><div class="nm">'+it+'</div><div class="st miss pend">Pendiente — ingresa a Zajuna y envía esta evidencia</div></div></div>';
      else if(g==='D'||g==='d') html+='<div class="ev"><span class="ic">&#128260;</span><div><div class="nm">'+it+'</div><div class="st miss retry">Puedes intentarlo de nuevo — corrige y reenvía esta evidencia</div></div></div>';
      else{var num=parseFloat(g);var low=!isNaN(num)&&num<70;
        html+='<div class="ev"><span class="ic">'+(low?'&#9888;&#65039;':'&#9989;')+'</span><div><div class="nm">'+it+'</div><div class="st '+(low?'low':'ok')+'">Nota: '+g+'</div></div></div>';}
    });
  });
  html+='<button class="back" onclick="back()">&#8592; Volver</button>';
  document.getElementById('result').innerHTML=html;
  document.getElementById('login').style.display='none';
  document.getElementById('result').style.display='block';
}
function back(){document.getElementById('result').style.display='none';document.getElementById('login').style.display='block';document.getElementById('ced').value='';}
document.getElementById('btn').addEventListener('click',lookup);
document.getElementById('ced').addEventListener('keydown',function(e){if(e.key==='Enter')lookup()});
</script>
